name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 0 * * 0,4'  # Every Sunday & Thursday at midnight UTC
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://${{ secrets.SUPABASE_URL }}/rest/v1/lists" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
