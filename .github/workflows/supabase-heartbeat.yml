name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 12 */3 * *'  # Every 3 days at noon UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail -s -X GET "https://${{ secrets.SUPABASE_URL }}/rest/v1/lists" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            && echo "✅ Supabase ping successful" \
            || (echo "❌ Ping failed" && exit 1)
